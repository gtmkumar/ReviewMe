version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: reviewme-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: reviewme
    volumes:
      - mongodb_data:/data/db
    networks:
      - reviewme-network

volumes:
  mongodb_data:

networks:
  reviewme-network:
    driver: bridge